<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,orientation=landscape" />
  <title>FPS 对决 - 云端联机版</title>
  <style>
    html, body { margin:0; height:100%; width:100%; overflow:hidden; background:#000; font-family:system-ui,-apple-system,sans-serif; touch-action:none; }
    canvas { display:block; width:100%; height:100%; }

    #hud { position:fixed; inset:0; pointer-events:none; z-index:5; }
    #msg { position:absolute; left:50%; top:12px; transform:translateX(-50%); font-size:14px; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.7); opacity:0; transition: opacity 0.2s; }
    #crosshair { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:4px; height:4px; background:#fff; border-radius:50%; box-shadow:0 0 2px #000; }

    #scope { position:absolute; inset:0; display:none; pointer-events:none; background:radial-gradient(circle at center, rgba(0,0,0,0) 0 35%, rgba(0,0,0,.95) 36% 100%); }
    #scopeLines { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(80vmin,900px); height:min(80vmin,900px); border-radius:50%; border:2px solid rgba(0,0,0,.2); }
    #scopeLines:before, #scopeLines:after { content:""; position:absolute; left:50%; top:50%; background:rgba(0,0,0,.95); transform:translate(-50%,-50%); }
    #scopeLines:before { width:2px; height:100%; } #scopeLines:after { width:100%; height:2px; }

    #deathScreen { position:fixed; inset:0; background:rgba(15,0,0,0.85); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:15; color:#fff; backdrop-filter:blur(4px); }
    #deathTitle { font-size:40px; font-weight:900; color:#ef4444; margin-bottom:5px; text-shadow:0 4px 12px rgba(239,68,68,0.5); }
    #deathTimer { font-size:20px; font-weight:bold; }
    
    #invincibleOverlay { position:fixed; inset:0; box-shadow:inset 0 0 50px rgba(56,189,248,0.4); border:4px solid rgba(56,189,248,0.6); pointer-events:none; display:none; z-index:4; }

    #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg, rgba(240,250,255,.85), rgba(200,225,245,.95)); color:#0b1220; z-index:20; padding:10px; }
    .card { width:min(780px, 94vw); max-height:90vh; overflow-y:auto; padding:16px; border-radius:10px; background:rgba(255,255,255,.92); backdrop-filter:blur(10px); box-shadow:0 10px 30px rgba(0,0,0,0.15); }
    .row { display:flex; gap:12px; flex-wrap:wrap; }
    .col { flex:1 1 260px; }
    button, input { pointer-events:auto; font-family:inherit; }
    button { padding:8px 12px; border-radius:8px; border:1px solid rgba(0,0,0,.15); background:#fff; cursor:pointer; font-weight:bold; font-size:12px; }
    button:active { transform:scale(0.96); background:#f1f5f9; }
    input { width:100%; box-sizing:border-box; border-radius:8px; border:1px solid rgba(0,0,0,.18); padding:8px; font-size:14px; text-align:center; font-weight:bold; letter-spacing:2px; }

    #mobileUI { position:fixed; inset:0; display:none; pointer-events:none; z-index:10; }
    #lookZone { pointer-events:auto; position:absolute; inset:0; z-index:1; }
    .stick { pointer-events:auto; position:absolute; left:25px; bottom:20px; width:110px; height:110px; border-radius:50%; background:rgba(0,0,0,.2); border:1px solid rgba(255,255,255,.2); z-index:10; }
    .stick .knob { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,0.5); z-index:11; }
    
    .btn { pointer-events:auto; position:absolute; border-radius:50%; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.25); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; user-select:none; z-index:10; font-size:12px; }
    .btn:active { background:rgba(255,255,255,.6); color:#000; }
    #btnShoot { right:25px; bottom:25px; width:72px; height:72px; background:rgba(239,68,68,0.4); font-size:15px; }
    #btnADS { right:110px; bottom:80px; width:48px; height:48px; }
    #btnJump { right:110px; bottom:20px; width:48px; height:48px; }
    #btnReload { right:170px; bottom:50px; width:48px; height:48px; }
    #btnSwap { right:225px; bottom:50px; width:48px; height:48px; }

    #uiBars { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); display:grid; gap:4px; width:min(280px, 50vw); pointer-events:none; z-index:5; }
    .panel { background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.15); border-radius:8px; padding:4px 8px; color:#fff; }
    .barBg { height:6px; background:rgba(0,0,0,.5); border-radius:999px; overflow:hidden; }
    .barFill { height:100%; width:100%; transition:width 0.1s ease-out; }
  </style>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <div id="overlay">
    <div class="card">
      <div style="font-size:18px; font-weight:800; color:#0f172a; margin-bottom:8px;">FPS 对决（Render 云端联机版）</div>
      <div class="row">
        <div class="col">
          <div style="font-size:12px; line-height:1.6; color:#475569;">
            • <b>电脑操作</b>：WASD 移动，鼠标控制视角，左键射击，右键开镜，R 换弹，1/2 切枪。<br>
            • <b>手机操作</b>：左侧虚拟摇杆移动，右侧空白滑动转动视角，开火键自动开镜并射击。<br>
            • <b>规则机制</b>：击中躯干 100 伤害（一枪淘汰），头部及四肢 50 伤害；淘汰后 5 秒自动复活，复活后获得 3 秒无敌护盾。
          </div>
          <div style="margin-top:12px; display:flex; gap:8px;">
            <button id="btnSingle" style="background:#e2e8f0;">单人训练</button>
            <button id="btnMulti" style="background:#e2e8f0;">云端对战</button>
          </div>
          <button id="btnStart" style="background:#2563eb; color:white; border:none; width:100%; padding:10px; margin-top:10px; font-size:14px;">进入单人靶场</button>
        </div>
        <div class="col" id="multiPanel" style="display:none; border-left:1px solid #cbd5e1; padding-left:12px;">
          <div style="font-weight:700; font-size:13px; margin-bottom:6px;">云端房间联机</div>
          <button id="btnCreateRoom" style="background:#3b82f6; color:#fff; border:none; width:100%;">创建新房间 (生成6位短码)</button>
          <div style="margin-top:10px; font-size:11px; color:#64748b;">输入对方的 6 位房间号加入：</div>
          <div style="display:flex; gap:6px; margin-top:4px;">
            <input type="text" id="roomInput" maxlength="6" placeholder="例如 AB12CD">
            <button id="btnJoinRoom" style="background:#f59e0b; color:#fff; border:none;">加入</button>
          </div>
          <div style="margin-top:8px; font-size:12px;">连接状态: <span id="netState" style="color:#2563eb; font-weight:bold;">未连接</span></div>
          <button id="btnEnterMatch" style="display:none; background:#10b981; color:white; border:none; width:100%; padding:10px; margin-top:10px; font-size:14px;">⚡ 双方就绪，进入战局 ⚡</button>
        </div>
      </div>
    </div>
  </div>

  <div id="deathScreen">
    <div id="deathTitle">YOU DIED</div>
    <div id="deathTimer">Respawning in 5.0...</div>
  </div>
  <div id="invincibleOverlay"></div>

  <div id="hud">
    <div id="crosshair"></div>
    <div id="msg"></div>
    <div id="uiBars">
      <div class="panel">
        <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:bold; margin-bottom:2px;">
          <div>HP</div>
          <div>AMMO <span id="ammoText"></span></div>
        </div>
        <div style="display:flex; gap:4px;">
          <div class="barBg" style="flex:1;"><div id="hpFill" class="barFill" style="background:#10b981;"></div></div>
          <div class="barBg" style="flex:1;"><div id="ammoFill" class="barFill" style="background:#f59e0b;"></div></div>
        </div>
      </div>
    </div>
    <div id="scope"><div id="scopeLines"></div></div>
  </div>

  <div id="mobileUI">
    <div id="lookZone"></div>
    <div class="stick" id="moveStick"><div class="knob" id="moveKnob"></div></div>
    <div class="btn" id="btnShoot">开火</div>
    <div class="btn" id="btnADS">开镜</div>
    <div class="btn" id="btnJump">跳跃</div>
    <div class="btn" id="btnReload">换弹</div>
    <div class="btn" id="btnSwap">切枪</div>
  </div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

// 已经自动绑定你的 Render 云端服务地址
const SOCKET_SERVER_URL = "https://one1sad.onrender.com";

const isMobile = matchMedia("(pointer: coarse)").matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const overlay = document.getElementById('overlay'), msgEl = document.getElementById('msg'), scopeEl = document.getElementById('scope'), crosshair = document.getElementById('crosshair');
const deathScreen = document.getElementById('deathScreen'), deathTimerEl = document.getElementById('deathTimer'), invincibleOverlay = document.getElementById('invincibleOverlay');
const btnStart = document.getElementById('btnStart'), btnSingle = document.getElementById('btnSingle'), btnMulti = document.getElementById('btnMulti');
const multiPanel = document.getElementById('multiPanel'), btnCreateRoom = document.getElementById('btnCreateRoom'), btnJoinRoom = document.getElementById('btnJoinRoom');
const roomInput = document.getElementById('roomInput'), netStateEl = document.getElementById('netState'), btnEnterMatch = document.getElementById('btnEnterMatch');
const mobileUI = document.getElementById('mobileUI'), lookZone = document.getElementById('lookZone'), moveStick = document.getElementById('moveStick'), moveKnob = document.getElementById('moveKnob');
const btnShoot = document.getElementById('btnShoot'), btnADS = document.getElementById('btnADS'), btnJump = document.getElementById('btnJump'), btnReload = document.getElementById('btnReload'), btnSwap = document.getElementById('btnSwap');
const hpFill = document.getElementById("hpFill"), ammoFill = document.getElementById("ammoFill"), ammoText = document.getElementById("ammoText");

let msgTimeout;
function flashMsg(s, t=1500) { 
  msgEl.textContent = s; msgEl.style.opacity = "1"; 
  clearTimeout(msgTimeout);
  msgTimeout = setTimeout(() => msgEl.style.opacity = "0", t); 
}
function clamp(x,a,b){ return Math.max(a, Math.min(b,x)); }
function expLerp(a,b,k,dt){ return a + (b-a) * (1 - Math.exp(-k*dt)); }

const state = {
  mode:"single", started:false, locked:false, time:0, dt:0,
  keys:new Set(), vel:new THREE.Vector3(), onGround:true, pos:new THREE.Vector3(0,1.7,10), yaw:0, pitch:0,
  slowSpeed:2.5, runSpeed:7.0, jumpVel:5.5, gravity:14.0, hp:100, bobTime:0,
  weapon:"sniper", ads:false, equipT:0,
  canShoot:true, fireCooldown:1.2, fireTimer:0, mag:5, magSize:5, reserve:25, 
  reloading:false, reloadT:0, bolting:false, boltT:0,
  recoilKick:0, recoilVel:0, recoilReturn:25, recoilDamp:16, recoilYawJitter:0,
  knifeCooldown:0.45, knifeTimer:0, knifeMode:"idle", knifeT:0,
  mobMove:{x:0, y:0},
  dead:false, respawnTimer:0, invincible:false, invincibleTimer:0,
  vmPos:new THREE.Vector3()
};

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x7ec0ee, 1);
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x7ec0ee, 0.005); 
const camera = new THREE.PerspectiveCamera(isMobile ? 75 : 80, innerWidth/innerHeight, 0.05, 300);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd0d0d0, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(40, 80, 20);
scene.add(sun);

const colliders = [];
function makeBox(w,h,d,x,y,z,color=0xcccccc) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({ color, roughness:0.8 }));
  m.position.set(x,y,z); scene.add(m);
  m.updateMatrixWorld(true);
  colliders.push(new THREE.Box3().setFromObject(m));
  return m;
}

const ground = new THREE.Mesh(new THREE.PlaneGeometry(300,300), new THREE.MeshStandardMaterial({ color:0x555e69, roughness:0.9 }));
ground.rotation.x = -Math.PI/2; scene.add(ground);

makeBox(60,8,2, 0,4,-25); makeBox(60,8,2, 0,4,25); makeBox(2,8,50, -30,4,0); makeBox(2,8,50, 30,4,0);
makeBox(3.5, 1.2, 3.5, 0, 0.6, 0, 0x888888);
makeBox(5.0, 2.2, 1.5, -12, 1.1, -6, 0x999999); makeBox(5.0, 2.2, 1.5, 12, 1.1, -6, 0x999999);

function resolveCollisions() {
  if (state.dead) return;
  const r = 0.35, feetY = state.pos.y - 1.7;
  for (const c of colliders) {
    if (feetY >= c.max.y - 0.1) continue;
    if (state.pos.x > c.min.x - r && state.pos.x < c.max.x + r && state.pos.z > c.min.z - r && state.pos.z < c.max.z + r) {
      const dxMin = Math.abs(state.pos.x - (c.min.x - r)), dxMax = Math.abs((c.max.x + r) - state.pos.x);
      const dzMin = Math.abs(state.pos.z - (c.min.z - r)), dzMax = Math.abs((c.max.z + r) - state.pos.z);
      const m = Math.min(dxMin, dxMax, dzMin, dzMax);
      if (m === dxMin) state.pos.x = c.min.x - r; else if (m === dxMax) state.pos.x = c.max.x + r;
      else if (m === dzMin) state.pos.z = c.min.z - r; else state.pos.z = c.max.z + r;
    }
  }
}

function createHumanoidModel(colorHex) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness:0.4 });
  const headMat = new THREE.MeshStandardMaterial({ color: 0xffd4a3, roughness:0.4 });

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), headMat);
  head.position.y = 1.6;
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.6, 0.25), mat);
  torso.position.y = 1.15;
  const armL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, 0.15), mat);
  armL.position.set(-0.3, 1.15, 0);
  const armR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, 0.15), mat);
  armR.position.set(0.3, 1.15, 0);
  const legL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.8, 0.18), mat);
  legL.position.set(-0.12, 0.4, 0);
  const legR = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.8, 0.18), mat);
  legR.position.set(0.12, 0.4, 0);

  g.add(head, torso, armL, armR, legL, legR);
  return { root: g, head, body: torso, armL, armR, legL, legR, mat };
}

const dummyGroup = new THREE.Group(); scene.add(dummyGroup);
const dummies = [];
function makeDummy(x, z) {
  const model = createHumanoidModel(0xef4444);
  model.root.position.set(x, 0, z);
  model.root.userData = { alive:true, hp:100, body:model.body, limbs:[model.armL, model.armR, model.legL, model.legR], stateT:0, angle:0, speed:0, respawnT:0 };
  dummyGroup.add(model.root); dummies.push(model.root);
}
makeDummy(-8, -12); makeDummy(0, -16); makeDummy(8, -12);

function updateDummies(dt) {
  for (const d of dummies) {
    if (!d.userData.alive) {
      d.userData.respawnT -= dt;
      if (d.userData.respawnT <= 0) {
        d.userData.alive = true; d.userData.hp = 100;
        d.visible = (state.mode === "single");
        d.position.set((Math.random()-0.5)*36, 0, (Math.random()-0.5)*26);
      }
      continue;
    }
    if (!d.visible) continue;
    d.userData.stateT -= dt;
    if (d.userData.stateT <= 0) {
      d.userData.stateT = 2 + Math.random()*2;
      d.userData.angle = Math.random() * Math.PI * 2;
      d.userData.speed = Math.random() > 0.4 ? 2.5 : 0;
    }
    if (d.userData.speed > 0) {
      d.position.x = clamp(d.position.x + Math.sin(d.userData.angle) * d.userData.speed * dt, -26, 26);
      d.position.z = clamp(d.position.z + Math.cos(d.userData.angle) * d.userData.speed * dt, -22, 22);
      const walkT = state.time * 10;
      d.userData.limbs[0].rotation.x = Math.sin(walkT)*0.5;
      d.userData.limbs[1].rotation.x = -Math.sin(walkT)*0.5;
      d.userData.limbs[2].rotation.x = -Math.sin(walkT)*0.5;
      d.userData.limbs[3].rotation.x = Math.sin(walkT)*0.5;
    } else {
      d.userData.limbs.forEach(l => l.rotation.x = 0);
    }
  }
}

const viewRoot = new THREE.Group(); scene.add(viewRoot);
const sniperVM = new THREE.Group(); viewRoot.add(sniperVM);
const knifeVM = new THREE.Group(); viewRoot.add(knifeVM);

function buildSniper() {
  const metal = new THREE.MeshStandardMaterial({ color:0x1e293b, roughness:0.3 });
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.14, 0.8), metal); body.position.set(0.1, -0.2, -0.4);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.2, 8), metal); barrel.rotation.x = Math.PI/2; barrel.position.set(0.1, -0.15, -1.0);
  const scope = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.4, 8), metal); scope.rotation.x = Math.PI/2; scope.position.set(0.1, -0.06, -0.5);
  g.add(body, barrel, scope);
  return g;
}
sniperVM.add(buildSniper());

function buildKnife() {
  const g = new THREE.Group();
  const blade = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.35, 4), new THREE.MeshStandardMaterial({ color:0xe2e8f0, roughness:0.2 }));
  blade.rotation.x = Math.PI/2; blade.position.set(0, 0, -0.2);
  g.add(blade);
  return g;
}
knifeVM.add(buildKnife());

let audioCtx;
function playSound(type) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  if (type === "shoot") {
    osc.type = "square"; osc.frequency.setValueAtTime(140, t); osc.frequency.exponentialRampToValueAtTime(0.01, t+0.2);
    gain.gain.setValueAtTime(0.4, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.2);
  } else if (type === "reload") {
    osc.type = "triangle"; osc.frequency.setValueAtTime(350, t); osc.frequency.linearRampToValueAtTime(200, t+0.1);
    gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.01, t+0.1);
  }
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.25);
}

function playerDie() {
  if (state.dead) return;
  state.dead = true; state.ads = false; state.respawnTimer = 5.0;
  deathScreen.style.display = "flex"; crosshair.style.display = "none";
  if (document.pointerLockElement) document.exitPointerLock();
}

function playerRespawn() {
  state.dead = false; state.hp = 100; state.mag = state.magSize; state.reserve = 25;
  state.invincible = true; state.invincibleTimer = 3.0;
  state.pos.set((Math.random()-0.5)*36, 1.7, (Math.random()-0.5)*26);
  state.vel.set(0,0,0);
  deathScreen.style.display = "none";
  crosshair.style.display = (state.weapon==="knife"||!state.ads) ? "block" : "none";
  if (!isMobile && state.started) lockPointer();
  sendSocketNet({ t:"respawn", px:state.pos.x, pz:state.pos.z });
}

function setWeapon(w) {
  state.weapon = w; state.ads = false; state.equipT = 0.3;
  flashMsg(w === "sniper" ? "装备狙击步枪" : "装备近战匕首", 800);
}

function beginReload() {
  if (state.dead || state.reloading || state.mag >= state.magSize || state.reserve <= 0 || state.weapon !== "sniper") return;
  state.reloading = true; state.reloadT = 0;
  playSound("reload"); flashMsg("换弹中...");
}

const raycaster = new THREE.Raycaster();
function attackPrimary() {
  if (state.dead || state.equipT > 0 || state.reloading || state.bolting) return;
  if (state.weapon === "sniper") {
    if (!state.canShoot) return;
    if (state.mag <= 0) { beginReload(); return; }
    state.mag--; playSound("shoot"); state.canShoot = false; state.fireTimer = 0;
    
    state.recoilVel += state.ads ? 0.35 : 0.7;
    const dir = new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(state.pitch + state.recoilKick, state.yaw, 0, 'YXZ')).normalize();
    raycaster.set(camera.position, dir); raycaster.far = 300;
    state.ads = false;

    const targets = [...dummyGroup.children];
    if (net.connected && peerModel.root.visible) targets.push(peerModel.root);
    const hits = raycaster.intersectObjects(targets, true);

    if (hits.length > 0) {
      const hitObj = hits[0].object;
      if (net.connected && (hitObj === peerModel.body || peerModel.root.children.includes(hitObj))) {
        if (!net.peer.invincible && net.peer.hp > 0) {
          const dmg = (hitObj === peerModel.body) ? 100 : 50;
          sendSocketNet({ t:"damage", amt:dmg });
          flashMsg(`命中对手 -${dmg}`);
        } else {
          flashMsg("对手处于无敌状态");
        }
      } else {
        let root = hitObj; while (root && !dummies.includes(root)) root = root.parent;
        if (root && root.userData.alive && state.mode === "single") {
          const dmg = (hitObj === root.userData.body) ? 100 : 50;
          root.userData.hp -= dmg;
          if (root.userData.hp <= 0) {
            root.userData.alive = false; root.visible = false; root.userData.respawnT = 4.0;
            flashMsg(`击倒假人 ${dmg===100?"(身体100)":"(部位50)"}`);
          } else {
            flashMsg(`命中假人 -${dmg}`);
          }
        }
      }
    }
  } else {
    // 匕首攻击
    if (state.knifeTimer > 0) return;
    state.knifeTimer = state.knifeCooldown; playSound("reload");
    const dir = new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(state.pitch, state.yaw, 0, 'YXZ')).normalize();
    raycaster.set(camera.position, dir); raycaster.far = 2.5;
    const hits = raycaster.intersectObjects([...dummyGroup.children, peerModel.root], true);
    if (hits.length > 0) {
      if (net.connected && peerModel.root.children.includes(hits[0].object)) {
        if (!net.peer.invincible && net.peer.hp > 0) { sendSocketNet({ t:"damage", amt:40 }); flashMsg("匕首击中对手 -40"); }
      }
    }
  }
}

// Socket.io 房间网络逻辑
const socket = io(SOCKET_SERVER_URL, { autoConnect:false });
const net = { connected:false, currentRoom:null, peer:{ pos:new THREE.Vector3(0,0,-6), yaw:0, hp:100, invincible:false, walkT:0 } };
const peerModel = createHumanoidModel(0x3b82f6);
peerModel.root.visible = false; scene.add(peerModel.root);

function sendSocketNet(m) {
  if (net.connected && net.currentRoom) {
    socket.emit('signal', { roomId: net.currentRoom, data: m });
  }
}

socket.on('player-joined', () => {
  net.connected = true; peerModel.root.visible = true;
  netStateEl.textContent = "已就绪"; btnEnterMatch.style.display = "block";
  flashMsg("对方已进入房间！", 2000);
});

socket.on('peer-disconnected', () => {
  net.connected = false; peerModel.root.visible = false;
  netStateEl.textContent = "对方已离线"; btnEnterMatch.style.display = "none";
  flashMsg("对方已断开");
});

socket.on('signal', ({ data: m }) => {
  if (m.t === "state") {
    net.peer.pos.set(m.px, m.py, m.pz); net.peer.yaw = m.yaw; net.peer.hp = m.hp; net.peer.invincible = m.inv;
    if (Math.hypot(m.vx, m.vz) > 0.5) net.peer.walkT += 0.1;
  } else if (m.t === "respawn") {
    net.peer.hp = 100; net.peer.pos.set(m.px, 1.7, m.pz);
  } else if (m.t === "damage") {
    if (!state.dead && !state.invincible) {
      state.hp = Math.max(0, state.hp - m.amt);
      flashMsg(`受到伤害 -${m.amt}`);
      if (state.hp <= 0) playerDie();
    }
  }
});

btnCreateRoom.onclick = () => {
  socket.connect();
  socket.emit('create-room', (res) => {
    if (res.success) {
      net.currentRoom = res.roomId;
      netStateEl.textContent = `房号: ${res.roomId} (等待对方加入)`;
    }
  });
};

btnJoinRoom.onclick = () => {
  const code = roomInput.value.trim().toUpperCase();
  if (code.length !== 6) { flashMsg("请输入完整的 6 位房间号"); return; }
  socket.connect();
  socket.emit('join-room', code, (res) => {
    if (res.success) {
      net.currentRoom = code; net.connected = true; peerModel.root.visible = true;
      netStateEl.textContent = `已加入: ${code}`;
      btnEnterMatch.style.display = "block";
    } else {
      flashMsg(res.message);
    }
  });
};

function startGame() {
  state.started = true; overlay.style.display = "none";
  state.dead = false; state.invincible = false; state.hp = 100;
  state.pos.set((Math.random()-0.5)*20, 1.7, (Math.random()-0.5)*20);
  if (isMobile) mobileUI.style.display = "block";
  else lockPointer();
  dummies.forEach(d => { d.visible = (state.mode === "single"); });
}

btnStart.onclick = startGame;
btnEnterMatch.onclick = startGame;
btnSingle.onclick = () => { state.mode = "single"; multiPanel.style.display = "none"; btnStart.style.display = "block"; };
btnMulti.onclick = () => { state.mode = "multi"; multiPanel.style.display = "block"; btnStart.style.display = "none"; };

function lockPointer(){ renderer.domElement.requestPointerLock(); }
document.addEventListener('pointerlockchange', () => state.locked = (document.pointerLockElement === renderer.domElement));

if (!isMobile) {
  addEventListener('mousedown', (e) => {
    if (!state.locked || state.dead) return;
    if (e.button === 0) attackPrimary();
    if (e.button === 2 && state.weapon === "sniper") state.ads = true;
  });
  addEventListener('mouseup', (e) => {
    if (e.button === 2) state.ads = false;
  });
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('mousemove', (e) => {
    if (!state.locked || state.dead) return;
    const sens = (state.weapon==="sniper" && state.ads) ? 0.001 : 0.002;
    state.yaw -= e.movementX * sens; state.pitch -= e.movementY * sens;
    state.pitch = clamp(state.pitch, -1.45, 1.45);
  });
  addEventListener('keydown', (e) => {
    if (state.dead) return;
    state.keys.add(e.code);
    if (e.code === "Digit1") setWeapon("sniper");
    if (e.code === "Digit2") setWeapon("knife");
    if (e.code === "KeyR") beginReload();
  });
  addEventListener('keyup', e => state.keys.delete(e.code));
  renderer.domElement.addEventListener('click', () => { if (state.started && !state.locked) lockPointer(); });
} else {
  btnShoot.onpointerdown = (e) => {
    e.preventDefault(); e.target.setPointerCapture(e.pointerId);
    if (!state.dead && state.weapon === "sniper") state.ads = true;
    attackPrimary();
  };
  btnADS.onpointerdown = (e) => { e.preventDefault(); state.ads = !state.ads; };
  btnJump.onpointerdown = (e) => { e.preventDefault(); if (state.onGround) { state.vel.y = state.jumpVel; state.onGround = false; } };
  btnReload.onpointerdown = (e) => { e.preventDefault(); beginReload(); };
  btnSwap.onpointerdown = (e) => { e.preventDefault(); setWeapon(state.weapon === "sniper" ? "knife" : "sniper"); };

  let stickId = null, center = {x:0, y:0};
  moveStick.onpointerdown = (e) => {
    stickId = e.pointerId; moveStick.setPointerCapture(stickId);
    const r = moveStick.getBoundingClientRect(); center = { x: r.left + r.width/2, y: r.top + r.height/2 };
  };
  moveStick.onpointermove = (e) => {
    if (e.pointerId !== stickId) return;
    const dx = e.clientX - center.x, dy = e.clientY - center.y, len = Math.hypot(dx,dy)||1, r = Math.min(36, len);
    const kx = (dx/len)*r, ky = (dy/len)*r;
    moveKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
    state.mobMove = { x: clamp(kx/36,-1,1), y: clamp(ky/36,-1,1) };
  };
  moveStick.onpointerup = moveStick.onpointercancel = () => {
    stickId = null; moveKnob.style.transform = `translate(-50%,-50%)`; state.mobMove = { x:0, y:0 };
  };

  let lookId = null, lastX = 0, lastY = 0;
  lookZone.onpointerdown = (e) => { lookId = e.pointerId; lookZone.setPointerCapture(lookId); lastX = e.clientX; lastY = e.clientY; };
  lookZone.onpointermove = (e) => {
    if (e.pointerId !== lookId || state.dead) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    const sens = (state.weapon==="sniper" && state.ads) ? 0.003 : 0.005;
    state.yaw -= dx * sens; state.pitch -= dy * sens;
    state.pitch = clamp(state.pitch, -1.45, 1.45);
  };
  lookZone.onpointerup = lookZone.onpointercancel = () => { lookId = null; };
}

let lastT = performance.now(), netSyncT = 0;
function tick(now) {
  const dt = Math.min(0.033, (now - lastT)/1000); lastT = now;
  state.dt = dt; state.time += dt;

  if (state.dead) {
    state.respawnTimer -= dt;
    deathTimerEl.textContent = `Respawning in ${Math.max(0, state.respawnTimer).toFixed(1)}...`;
    if (state.respawnTimer <= 0) playerRespawn();
  }

  if (state.invincible) {
    state.invincibleTimer -= dt;
    invincibleOverlay.style.display = "block";
    if (state.invincibleTimer <= 0) { state.invincible = false; invincibleOverlay.style.display = "none"; }
  }

  if (!state.canShoot) { state.fireTimer += dt; if (state.fireTimer >= state.fireCooldown) state.canShoot = true; }
  if (state.reloading && !state.dead) {
    state.reloadT += dt;
    if (state.reloadT >= 1.6) {
      const take = Math.min(state.magSize - state.mag, state.reserve);
      state.reserve -= take; state.mag += take; state.reloading = false;
      flashMsg("装填完毕", 600);
    }
  }
  if (state.knifeTimer > 0) state.knifeTimer = Math.max(0, state.knifeTimer - dt);

  state.recoilVel -= state.recoilVel * state.recoilDamp * dt;
  state.recoilKick = expLerp(state.recoilKick + state.recoilVel*dt, 0, state.recoilReturn, dt);

  const forward = new THREE.Vector3(Math.sin(state.yaw), 0, Math.cos(state.yaw)).multiplyScalar(-1);
  const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();
  const wish = new THREE.Vector3();
  if (!state.dead) {
    if (isMobile) { wish.addScaledVector(forward, -state.mobMove.y); wish.addScaledVector(right, state.mobMove.x); }
    else {
      if (state.keys.has("KeyW")) wish.add(forward); if (state.keys.has("KeyS")) wish.sub(forward);
      if (state.keys.has("KeyD")) wish.add(right); if (state.keys.has("KeyA")) wish.sub(right);
    }
    if (wish.lengthSq() > 0) wish.normalize();
  }

  const speed = state.runSpeed * (state.ads ? 0.5 : 1.0);
  state.vel.x = expLerp(state.vel.x, wish.x * speed, 25, dt);
  state.vel.z = expLerp(state.vel.z, wish.z * speed, 25, dt);
  if (!isMobile && state.keys.has("Space") && state.onGround && !state.dead) { state.vel.y = state.jumpVel; state.onGround = false; }
  if (!state.onGround) state.vel.y -= state.gravity * dt;
  state.pos.addScaledVector(state.vel, dt);
  if (state.pos.y <= 1.7) { state.pos.y = 1.7; state.vel.y = 0; state.onGround = true; }

  resolveCollisions();
  if (state.mode === "single") updateDummies(dt);

  camera.position.copy(state.pos);
  if (!state.dead) {
    camera.rotation.order = "YXZ";
    camera.rotation.y = state.yaw; camera.rotation.x = state.pitch + state.recoilKick;
  }

  const showScope = (state.weapon === "sniper" && state.ads && !state.dead);
  camera.fov = expLerp(camera.fov, showScope ? 25 : (isMobile ? 75 : 80), 16, dt);
  camera.updateProjectionMatrix();
  scopeEl.style.display = showScope ? "block" : "none";
  crosshair.style.display = (!state.dead && !showScope) ? "block" : "none";

  viewRoot.scale.setScalar(1.6);
  viewRoot.position.copy(camera.position); viewRoot.quaternion.copy(camera.quaternion);
  const targetVM = (state.weapon === "sniper") ? new THREE.Vector3(0.26, -0.38, -0.6) : new THREE.Vector3(0.3, -0.35, -0.5);
  viewRoot.position.add(targetVM.applyQuaternion(camera.quaternion));
  sniperVM.visible = (state.weapon === "sniper") && !showScope && !state.dead;
  knifeVM.visible = (state.weapon === "knife") && !state.dead;

  if (net.connected) {
    if (net.peer.hp <= 0) {
      peerModel.root.visible = false;
    } else {
      peerModel.root.visible = true;
      peerModel.root.position.set(net.peer.pos.x, net.peer.pos.y - 1.7, net.peer.pos.z);
      peerModel.root.rotation.y = net.peer.yaw;
      peerModel.mat.opacity = net.peer.invincible ? 0.4 : 1.0;
      peerModel.mat.transparent = net.peer.invincible;
      peerModel.armL.rotation.x = Math.sin(net.peer.walkT)*0.5;
      peerModel.armR.rotation.x = -Math.sin(net.peer.walkT)*0.5;
      peerModel.legL.rotation.x = -Math.sin(net.peer.walkT)*0.5;
      peerModel.legR.rotation.x = Math.sin(net.peer.walkT)*0.5;
    }

    netSyncT += dt;
    if (netSyncT > 0.05) {
      netSyncT = 0;
      sendSocketNet({ t:"state", px:state.pos.x, py:state.pos.y, pz:state.pos.z, yaw:state.yaw, vx:state.vel.x, vz:state.vel.z, hp:state.hp, inv:state.invincible });
    }
  }

  hpFill.style.width = `${clamp(state.hp, 0, 100)}%`;
  ammoFill.style.width = `${(state.mag / state.magSize) * 100}%`;
  ammoText.textContent = `${state.mag} / ${state.reserve}`;

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
